## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # Pinned, not '*'. Both targets share one managed_components/ directory, so an
  # unpinned LVGL let whichever target built last decide the version for the
  # other and for the desktop sim (which reads managed_components/ directly).
  # That is how the esp32 lock ended up on 9.5.0 while the esp32s3 lock said
  # 9.6.0~1, and how a 9.6 install silently broke the sim's build.
  lvgl/lvgl: '~9.5.0'
  abobija/rc522: "^3.4.3"
  # Board-specific drivers, pulled in only for the target that uses them
  # (E32R40T = esp32, ES3C35P = esp32s3; see Kconfig.projbuild).
  espressif/esp_lcd_st7796:
    version: '*'
    rules:
      - if: "target == esp32"
  atanisoft/esp_lcd_touch_xpt2046:
    version: '*'
    rules:
      - if: "target == esp32"
  espressif/esp_lcd_st77922:
    version: "^2.1.0"
    rules:
      - if: "target == esp32s3"
  espressif/esp_codec_dev:
    version: "~1.6.2"
    rules:
      - if: "target == esp32s3"
